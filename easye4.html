<!-- ===================== gemeinsame Hilfsfunktionen für die Dialoge / shared editor helpers =====================
     Texte: locales/<sprache>/easye4.json, Hilfe: locales/<sprache>/easye4.html (de, en-US) -->
<script type="text/javascript">
    (function () {
        var STD = /^(MB|MW|MD|NB|NW|ND|QA|IA|ID|M|N|I|Q)$/;
        // kleinster beschreibbarer Index (I1-I16, IA1-IA4, ID1-ID25 sind reserviert)
        var MIN_WRITE = { I: 17, IA: 5, ID: 26 };

        function dialogType() {
            return $("#node-input-operandType").length ? $("#node-input-operandType").val() : undefined;
        }
        function minIndex(type, isOut) {
            return isOut && MIN_WRITE[type] ? MIN_WRITE[type] : 1;
        }
        window.easyE4Editor = {
            STD: STD,
            // Text für Knotenbeschriftung
            operandText: function (n, emptyText) {
                var t = n.operandType;
                if (t === undefined) return n.operand || emptyText;
                if (t === "all" || t === "msg" || t === "") return emptyText;
                if (t === "alias") return n.operandAlias || "Alias?";
                return t + (n.operandIndex || "?");
            },
            // Validatoren (im geöffneten Dialog gilt der aktuelle Feldinhalt, sonst der gespeicherte Knoten)
            indexValidator: function (isOut) {
                return function (v) {
                    var t = dialogType();
                    if (t === undefined) t = this.operandType;
                    if (!t || !STD.test(t)) return true;
                    var s = String(v === undefined || v === null ? "" : v).trim();
                    return /^\d+$/.test(s) && parseInt(s, 10) >= minIndex(t, isOut);
                };
            },
            aliasValidator: function (v) {
                var t = dialogType();
                if (t === undefined) t = this.operandType;
                if (t !== "alias") return true;
                return /^[A-Za-z0-9_]{1,32}$/.test(String(v || "").trim());
            },
            // Dialog vorbereiten: ältere Flows (nur Textfeld "operand") werden in Typ + Index umgesetzt
            prepareOperand: function (node, isOut) {
                var $type = $("#node-input-operandType"), $idx = $("#node-input-operandIndex"),
                    $alias = $("#node-input-operandAlias");
                if (node.operandType === undefined) {
                    var legacy = String(node.operand || "").trim();
                    var m = /^(MB|MW|MD|NB|NW|ND|QA|IA|ID|M|N|I|Q)0*(\d+)$/i.exec(legacy);
                    if (!legacy) { $type.val(isOut ? "msg" : "all"); }
                    else if (m && $type.find("option[value='" + m[1].toUpperCase() + "']").length) {
                        $type.val(m[1].toUpperCase()); $idx.val(parseInt(m[2], 10));
                    } else { $type.val("alias"); $alias.val(legacy); }
                }
                function update() {
                    var t = $type.val();
                    var std = STD.test(t || "");
                    $(".e4-index-row").toggle(std);
                    $(".e4-alias-row").toggle(t === "alias");
                    $(".e4-diag-row").toggle(t === "all");
                    var min = minIndex(t, isOut);
                    $idx.attr("min", min);
                    $(".e4-hint").text(isOut && min > 1 ? node._("easye4.label.writableFrom", { min: min }) : "");
                    // verstecktes Feld: Operandenname für ältere Laufzeit und Anzeige
                    var name = "";
                    if (std) name = t + ($idx.val() || "");
                    else if (t === "alias") name = String($alias.val() || "").trim();
                    $("#node-input-operand").val(name);
                    $idx.trigger("validate"); $alias.trigger("validate");
                }
                $type.on("change", update);
                $idx.on("input change", update);
                $alias.on("input change", update);
                update();
            },
            saveOperand: function () {
                var t = $("#node-input-operandType").val();
                var std = STD.test(t || "");
                var name = "";
                if (std) name = t + ($("#node-input-operandIndex").val() || "");
                else if (t === "alias") name = String($("#node-input-operandAlias").val() || "").trim();
                $("#node-input-operand").val(name);
            },
        };
    })();
</script>

<!-- ===================== Steuerung (Konfiguration) ===================== -->
<script type="text/javascript">
    (function () {
        function topicValid(v) {
            return !v || (v.length <= 511 && !/[#+]/.test(v));
        }
        function baseValid(v) {
            var mode = $("#node-config-input-topicMode").length ? $("#node-config-input-topicMode").val() : this.topicMode;
            if (mode !== "auto") return true;
            v = String(v || "").trim();
            return v.length > 0 && v.length <= 480 && !/[#+]/.test(v);
        }
        RED.nodes.registerType("easye4-device", {
            category: "config",
            defaults: {
                name: { value: "easyE4" },
                broker: { type: "mqtt-broker", required: true },
                topicMode: { value: "auto" },
                baseTopic: { value: "easye4/1", validate: baseValid },
                dataIn: { value: "", validate: topicValid },
                dataOut: { value: "", validate: topicValid },
                actionOut: { value: "", validate: topicValid },
                actionIn: { value: "", validate: topicValid },
                qos: { value: "0" },
            },
            label: function () {
                return this.name || "easyE4";
            },
            paletteLabel: "easyE4",
            oneditprepare: function () {
                var node = this;
                if (node.topicMode === undefined) $("#node-config-input-topicMode").val("manual"); // ältere Flows
                function base() { return String($("#node-config-input-baseTopic").val() || "").replace(/\/+$/, ""); }
                function update() {
                    var auto = $("#node-config-input-topicMode").val() === "auto";
                    $(".e4-auto").toggle(auto);
                    $(".e4-manual").toggle(!auto);
                    var b = base();
                    var rows = auto
                        ? [["data", b + "/data"], ["set", b + "/set"], ["actions/request", b + "/actions/request"], ["actions/response", b + "/actions/response"]]
                        : null;
                    var t = [
                        ["Publish topic", auto ? b + "/data" : $("#node-config-input-dataIn").val()],
                        ["Subscribe topic", auto ? b + "/set" : $("#node-config-input-dataOut").val()],
                        ["Actions publish topic", auto ? b + "/actions/response" : $("#node-config-input-actionIn").val()],
                        ["Actions subscribe topic", auto ? b + "/actions/request" : $("#node-config-input-actionOut").val()],
                    ];
                    var html = "";
                    t.forEach(function (r) {
                        var v = $("<div>").text(r[1] || node._("easye4.label.empty")).html();
                        html += "<tr><td style='padding-right:12px'>" + r[0] + "</td><td><code>" + v + "</code></td></tr>";
                    });
                    $("#e4-summary").html(html);
                    $("#node-config-input-baseTopic").trigger("validate");
                }
                $("#node-config-input-topicMode").on("change", update);
                $("#node-config-dialog-ok, #node-config-input-baseTopic, .e4-manual input").on("input change", update);
                update();
            },
        });
    })();
</script>

<script type="text/javascript">
    (function () {
        var ACTIONS = ["msg", "start", "stop", "getFB", "setFB", "saveFB", "loadProject", "updateFirmware"];
        RED.nodes.registerType("easye4-action", {
            category: "easyE4",
            color: "#8fc1e3",
            defaults: {
                name: { value: "" },
                device: { type: "easye4-device", required: true },
                action: { value: "msg" },
                fbtype: { value: "WT" },
                index: {
                    value: "1",
                    validate: function (v) {
                        var a = $("#node-input-action").length ? $("#node-input-action").val() : this.action;
                        if (a !== "getFB" && a !== "setFB") return true;
                        return /^\d+$/.test(String(v === undefined || v === null ? "" : v).trim());
                    },
                },
                allMessages: { value: false },
            },
            inputs: 1,
            outputs: 1,
            icon: "font-awesome/fa-bolt",
            label: function () {
                var l = ACTIONS.indexOf(this.action) >= 0 ? this._("easye4.action.label." + this.action) : this.action;
                if (this.action === "getFB" || this.action === "setFB") l += " " + (this.fbtype || "") + (this.index || "");
                return this.name || "easyE4: " + l;
            },
            paletteLabel: function () { return this._("easye4.action.paletteLabel"); },
            inputLabels: function () { return this._("easye4.action.input"); },
            outputLabels: function () { return this._("easye4.action.output"); },
            oneditprepare: function () {
                var node = this;
                function update() {
                    var a = $("#node-input-action").val();
                    $(".e4-fb-row").toggle(a === "getFB" || a === "setFB");
                    $("#e4-action-tip").html(ACTIONS.indexOf(a) >= 0 ? node._("easye4.action.tip." + a) : "");
                    $("#node-input-index").trigger("validate");
                }
                $("#node-input-action").on("change", update);
                update();
            },
        });
    })();
</script>
