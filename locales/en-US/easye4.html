<script type="text/html" data-help-name="easye4-device">
    <p>The easyE4 controller with everything Node-RED needs to connect to it: the MQTT broker and the four topics.
        The nodes <i>easyE4 read</i>, <i>easyE4 write</i> and <i>easyE4 action</i> refer to this controller.
        One entry per easyE4 is enough.</p>
    <h3>Simple: one base topic</h3>
    <p>You only enter a base topic, e.g. <code>easye4/1</code>. The four topics are derived from it.
        The table in the dialog shows what you have to enter in easySoft 8:</p>
    <ul>
        <li><b>Publish topic</b> = <code>&lt;base&gt;/data</code> (the easyE4 publishes its operands here)</li>
        <li><b>Subscribe topic</b> = <code>&lt;base&gt;/set</code> (the easyE4 receives values here)</li>
        <li><b>Actions publish topic</b> = <code>&lt;base&gt;/actions/response</code></li>
        <li><b>Actions subscribe topic</b> = <code>&lt;base&gt;/actions/request</code></li>
    </ul>
    <p>For several controllers use different base topics (<code>easye4/1</code>, <code>easye4/2</code> ...).</p>
    <h3>Individual</h3>
    <p>For your own topic names. Max. 511 characters, no wildcards (+ #). Topics that are not needed may stay empty.</p>
    <h3>MQTT broker</h3>
    <p>Create the broker with the pencil icon (server, port, TLS and credentials if required); it is the standard
        Node-RED MQTT broker. For Mosquitto on the same machine, <code>localhost</code>, port <code>1883</code> is enough.</p>
    <h3>Status below the nodes</h3>
    <p>The status shows whether the easyE4 itself is connected to the broker. It evaluates the
        <code>connected</code> message (the easyE4 sends <code>"true"</code> when it connects, the broker publishes
        its last will message <code>"false"</code> when the connection is lost).</p>
    <ul>
        <li><b>green:</b> easyE4 online (or the value for <i>easyE4 read</i> with a fixed operand)</li>
        <li><b>red, "easyE4 offline":</b> the easyE4 lost its connection. After switching it off this takes up to
            90 s (1.5 &times; keep-alive of 60 s).</li>
        <li><b>grey, "device unknown":</b> Node-RED is connected to the broker, but no message from the easyE4 has
            arrived yet (normal after a restart; changes with the next message).</li>
    </ul>
    <h3>Disclaimer</h3>
    <p>Unofficial project, not affiliated with Eaton. Use at your own risk. No liability whatsoever is accepted,
        in particular not for damage to machines, installations or persons caused by writing operands, RUN/STOP or
        program and firmware updates. Details: file <code>LICENSE</code> (MIT).</p>
</script>

<script type="text/html" data-help-name="easye4-in">
    <p>Reads an operand of the easyE4. The node sends a message every time the easyE4 reports the value.</p>
    <h3>Properties</h3>
    <dl class="message-properties">
        <dt>Operand + Index</dt>
        <dd>Select the operand type (e.g. <code>MW – Marker (word)</code>) and enter the number: type <code>MW</code>
            and index <code>3</code> gives <code>MW3</code>. With <i>Alias</i> you use a name assigned in easySoft 8.
            <i>All operands</i> outputs everything the easyE4 reports as one object.</dd>
        <dt>Diagnostic operands</dt>
        <dd>The easyE4 always sends the diagnostic operands ID1&ndash;ID25. With <i>All operands</i> they are only
            output if the checkbox is set. If you select ID as operand type, the value is always output.</dd>
        <dt>Only on change</dt>
        <dd>Only outputs a message if the value differs from the last one sent
            (the first value is always sent).</dd>
    </dl>
    <h3>Output</h3>
    <dl class="message-properties">
        <dt>payload</dt><dd>The value of the operand (with <i>All operands</i> an object <code>{M1: 1, MW3: 42}</code>).</dd>
        <dt>topic</dt><dd>Name of the operand as reported by the easyE4 (with <i>All</i> the MQTT topic).</dd>
    </dl>
    <p>The current value is shown below the node.</p>
</script>

<script type="text/html" data-help-name="easye4-out">
    <p>Sets an operand of the easyE4. The value is taken from <code>msg.payload</code>.</p>
    <h3>Properties</h3>
    <p>Select the operand type and enter the number: type <code>M</code> and index <code>5</code> gives <code>M5</code>.
        With <i>Alias</i> you use a name from easySoft 8. With <i>From the message</i> the message determines the operand.</p>
    <h3>Input</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">number | boolean | string</span></dt>
        <dd>The value. Numbers as text (<code>"42"</code>) and <code>true</code>/<code>false</code> are converted.</dd>
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>Operand name, if <i>From the message</i> is selected in the dialog.</dd>
    </dl>
    <p>With <i>From the message</i>, <code>msg.payload</code> can also be an object with several operands,
        e.g. <code>{"M5": 1, "MW3": 42}</code>.</p>
    <h3>Notes</h3>
    <ul>
        <li>Outputs (Q, QA) and the reserved operands I1&ndash;I16, IA1&ndash;IA4 and ID1&ndash;ID25 cannot be written;
            therefore the index for I, IA and ID starts at 17, 5 and 26.
            Values that do not match the type (e.g. 2 for a marker bit) are rejected.</li>
        <li>The easyE4 only processes write requests when it is running and connected to the broker.</li>
    </ul>
</script>

<script type="text/html" data-help-name="easye4-action">
    <p>Triggers an action on the easyE4 and outputs the response. Each message at the input sends the action once.
        Each action must be explicitly enabled in easySoft 8 on the <i>MQTT settings</i> tab.</p>
    <h3>Actions</h3>
    <table>
        <tr><th>Action</th><th><code>msg.payload</code></th><th>Effect</th></tr>
        <tr><td>RUN / STOP</td><td>&ndash;</td><td>Change operating mode (RUN only with a stored program)</td></tr>
        <tr><td>Read function block</td><td>&ndash;</td><td>Settings of the block (type and index from the dialog)</td></tr>
        <tr><td>Change function block</td><td><code>{A: {h: 10, min: 33}}</code></td>
            <td>Only channels with <code>chg: 1</code>; valid until the next restart</td></tr>
        <tr><td>Save FB changes</td><td>&ndash;</td><td>Save changed parameters permanently</td></tr>
        <tr><td>Load program / firmware</td><td><code>"http://.../file"</code></td><td>Update via URL</td></tr>
    </table>
    <p>If you select <i>From the message</i>, <code>msg.action</code> determines the action
        (<code>start, stop, getFB, setFB, saveFB, loadProject, updateFirmware</code>).
        Block type and index can then also be given in <code>msg.payload</code>:
        <code>{fbtype: "WT", index: 1, request: {A: {h: 10}}}</code>.
        Optionally <code>msg.id</code> sets the action ID, otherwise it is assigned automatically.</p>
    <h3>Output</h3>
    <p>The response of the easyE4 to this request. The original message is kept and extended by:</p>
    <dl class="message-properties">
        <dt>success</dt><dd><code>true</code> for <code>SUCCEEDED</code>, otherwise <code>false</code>.</dd>
        <dt>status / operation / id</dt><dd>Status, executed operation and action ID.</dd>
        <dt>errorMsg</dt><dd>Error text for <code>FAILED</code>, e.g. "Invalid FB index.".</dd>
        <dt>response</dt><dd>Payload data, e.g. the configuration when reading a function block.</dd>
        <dt>payload</dt><dd>The complete response of the easyE4.</dd>
    </dl>
    <p>For some actions the easyE4 first sends an intermediate message (<code>status: "IN_PROGRESS"</code>)
        and then the result. The node only outputs the result.</p>
    <p>Commands are never sent with retain. With the option <i>Also output other messages</i> intermediate messages
        (<code>msg.inProgress = true</code>) and status messages of the easyE4 that do not belong to a request of this
        node are output as well.</p>
</script>
